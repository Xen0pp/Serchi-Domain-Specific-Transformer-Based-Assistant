version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serchi-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_ID=Xen0pp/SmolLM-ML-Planner-500-V3
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serchi-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf-cache:
    driver: local
